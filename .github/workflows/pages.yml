name: Deploy NHHR Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Deploy without running the browser tests
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
        env:
          ATLAS_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      # The test shards serve this exact build rather than rebuilding it.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # The browser tests drive WebGL maps in software rendering, so they are
  # split across four runners that work at the same time.
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          ATLAS_BASE_PATH: ${{ needs.build.outputs.base_path }}/
  deploy:
    # Deploys after every test shard passes, or straight after the build
    # when a manual run skips the tests.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
